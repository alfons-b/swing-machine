name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IDX_TEST_DATABASE_URL: postgresql+psycopg://idx:idx@localhost:5432/idx_trading_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Backups are only valid when pg_dump/pg_restore and the server share a major
      # version (ADR 0011), so start the server matching the runner's client tools.
      - name: Start PostgreSQL matching the installed client
        run: |
          MAJOR=$(pg_dump --version | awk '{print $3}' | cut -d. -f1)
          echo "client major: $MAJOR"
          docker run -d --name pg -e POSTGRES_USER=idx -e POSTGRES_PASSWORD=idx \
            -e POSTGRES_DB=idx_trading_test -p 5432:5432 "postgres:${MAJOR}"
          for i in $(seq 1 30); do pg_isready -h localhost -U idx && break; sleep 2; done
          pg_isready -h localhost -U idx
      - run: uv sync --locked
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy
      - run: uv run pytest --cov=idx_trading --cov-report=term-missing
