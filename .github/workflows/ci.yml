name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: idx
          POSTGRES_PASSWORD: idx
          POSTGRES_DB: idx_trading_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IDX_TEST_DATABASE_URL: postgresql+psycopg://idx:idx@localhost:5432/idx_trading_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy
      - run: uv run pytest --cov=idx_trading --cov-report=term-missing
