# Trading assumptions used by labels, backtests and the portfolio simulator.
# Owner input 2026-11-21: broker Stockbit, simulation capital Rp 100,000,000.
broker: stockbit
capital_idr: 100000000
lot_size: 100
costs:
  # Fractions of traded value, including broker commission, IDX/KPEI/KSEI levy, VAT and
  # (on sells) 0.1% final income tax. Source: rankia.id Stockbit vs Ajaib comparison,
  # April 2026 (0.1513% / 0.2513%); other sources quote 0.15% / 0.25%. The higher,
  # conservative figures are used. Check them against the Stockbit app's fee page.
  buy: 0.001513
  sell: 0.002513
  reviewed_at: 2026-11-22
  evidence: https://rankia.id/trading-saham-stockbit-ajaib/
slippage:
  # Assumed until the backtester measures it from data: one tick against us on entry and on exit.
  ticks_per_side: 1
universe:
  # Agent-chosen floor (ADR 0015): below Rp 200 one tick is 0.5-1% of the price, and the
  # labels showed no edge there after costs (ADR 0014). Rp 1 bn mean daily traded value keeps
  # a Rp 10-20 m position under ~2% of a day's volume. Revisit at the 30 Nov evaluation.
  min_price_idr: 200
  min_adv_idr: 1000000000
signals:
  # Agent-chosen defaults (ADR 0016); the owner reviews them on 30 Nov.
  top_fraction: 0.2            # candidates = top 20% of the day's ranked stocks
  buy_min_expected_net: 0.005  # BUY only if expected return after costs >= +0.5%
  min_cross_section: 100       # fewer ranked stocks that day -> no BUY (ranks meaningless)
  stop_atr: 1.5                # stop = entry - 1.5 x ATR14
  reward_risk: 2.0             # target = entry + 2 x (entry - stop)
  max_entry_atr: 0.5           # do not chase: max entry = close + 0.5 x ATR14
  risk_per_trade: 0.01         # lose at most 1% of capital at the stop
  max_position: 0.2            # at most 20% of capital in one stock
  max_adv_share: 0.02          # at most 2% of 20-day mean traded value
  dq_lookback_days: 30         # open data-quality errors in this window block a BUY
  drift_sessions: 20           # market drift = median net return of the last 20 labelled days
