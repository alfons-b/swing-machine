    permissions:
      - purpose: automated_ingestion
        status: pending_review

  - source_id: bank_indonesia
    source_name: Bank Indonesia (bi.go.id)
    source_type: central_bank
    source_url: https://www.bi.go.id
    access_method: web
    license_type: unverified
    update_frequency: daily
    source_status: pending_review
    notes: Post-MVP macro source (BI rate, JISDOR).
    permissions:
      - purpose: automated_ingestion
        status: pending_review

  - source_id: bps
    source_name: Badan Pusat Statistik (bps.go.id)
    source_type: statistics_agency
    source_url: https://www.bps.go.id
    access_method: api
    license_type: unverified
    update_frequency: monthly
    source_status: pending_review
    notes: Post-MVP macro source. Offers a registered web API; verify terms and quotas.
    permissions:
      - purpose: automated_ingestion
        status: pending_review

  - source_id: yahoo_finance
    source_name: Yahoo Finance (.JK tickers)
    source_type: market_data_api
    source_url: https://finance.yahoo.com
    access_method: unofficial_api
    license_type: proprietary_terms
    terms_reference: https://legal.yahoo.com/us/en/yahoo/terms/otos/index.html
    update_frequency: daily
    reliability_score: 0.4
    source_status: blocked
    notes: >-
      Reviewed 2026-11-21. The Yahoo Terms of Service prohibit to "access or collect data
      ... using any automated means ... for any purpose without our express, prior
      permission" and using any data "to create any database, archive". Both are exactly
      what this system does, so Yahoo (and yfinance) must not be used.
    permissions:
      - purpose: automated_ingestion
        status: denied
        reviewed_at: 2026-11-21
        reviewed_by: claude-agent (delegated by system owner)
        evidence_url: https://legal.yahoo.com/us/en/yahoo/terms/otos/index.html

  - source_id: eodhd
    source_name: EODHD (EOD Historical Data) — Jakarta exchange (JK)
    source_type: market_data_api
    source_url: https://eodhd.com
    access_method: api
    license_type: eodhd_non_professional
    terms_reference: https://eodhd.com/financial-apis/terms-conditions
    rate_limit: "Free: 20 calls/day, 1y history. Paid: 100k calls/day, 30y+, bulk. 1,000 req/min."
    rate_limit_per_minute: 1000
    update_frequency: daily
    reliability_score: 0.7
    source_status: active
    notes: >-
      Selected as the automated EOD source (ADR 0008). Terms: Non-Professional Users
      "are permitted to store, manipulate, and analyze the data for private,
      non-commercial purposes" but may not share the account or redistribute.
      Data semantics: OHLC raw as traded; adjusted_close split+dividend adjusted;
      volume split-adjusted (OI-17). No traded value, frequency or foreign flow.
      Bulk (whole exchange, 100 calls) is not on the Free plan.
    permissions:
      - purpose: automated_ingestion
        status: approved
        reviewed_at: 2026-11-21
        reviewed_by: claude-agent (delegated by system owner)
        evidence_url: https://eodhd.com/financial-apis/terms-conditions
        notes: Private, non-commercial use by the single owner only (PRD 4.1).
      - purpose: raw_archive
        status: approved
        reviewed_at: 2026-11-21
        reviewed_by: claude-agent (delegated by system owner)
        evidence_url: https://eodhd.com/financial-apis/terms-conditions
        notes: Storage is explicitly permitted for non-professional users.
      - purpose: redistribution
        status: denied
        reviewed_at: 2026-11-21
        reviewed_by: claude-agent (delegated by system owner)
        evidence_url: https://eodhd.com/financial-apis/terms-conditions

  - source_id: twelve_data
    source_name: Twelve Data
    source_type: market_data_api
    source_url: https://twelvedata.com
    access_method: api
    license_type: twelve_data_terms
    terms_reference: https://twelvedata.com/terms
    rate_limit: "Basic (free): 8 credits/min, 800/day"
    update_frequency: daily
    source_status: inactive
    notes: >-
      Reviewed 2026-11-21. Terms allow storing data for Internal Use, but the Indonesia
      Stock Exchange page is marked "Pro+" (from USD 99/mo), so IDX is not on the free
      Basic plan. Kept as a paid alternative.
    permissions:
      - purpose: automated_ingestion
        status: pending_review

  - source_id: invezgo
    source_name: Invezgo API (Indonesia)
    source_type: market_data_api
    source_url: https://invezgo.com
    access_method: api
    license_type: unverified
    update_frequency: daily
    source_status: inactive
    notes: >-
      Reviewed 2026-11-21. Indonesian vendor with IDX-specific data (broker summary,
      foreign flow, financial statements). API access starts at IDR 499,900/month: not
      free. Terms not yet reviewed. Candidate for post-MVP enrichment.
    permissions:
      - purpose: automated_ingestion
        status: pending_review

  - source_id: bca_ir
    source_name: PT Bank Central Asia Tbk — investor relations (bca.co.id)
    source_type: issuer_ir
    source_url: https://www.bca.co.id/id/tentang-bca/hubungan-investor/laporan-presentasi/laporan-keuangan
    access_method: web
    license_type: public_regulatory_disclosure
    terms_reference: https://www.bca.co.id/en/Syarat-dan-Ketentuan
    rate_limit: "Self-imposed: 1 request / 2 s, only files not fetched before"
    update_frequency: quarterly
    reliability_score: 0.9
    source_status: active
    notes: >-
      Reviewed 2026-11-21 (ADR 0010). OJK-mandated quarterly publication reports. The
      site's terms page lists only product terms (KlikBCA, cards, ...) and no website or
      content terms; robots.txt does not disallow the report paths; the file host
      pustaka.bca.co.id has no robots.txt. Use is private analysis of published
      figures, no redistribution. Automated download approved by the owner (OI-30).
    permissions:
      - purpose: automated_ingestion
        status: approved
        reviewed_at: 2026-11-21
        reviewed_by: system owner (decision in session, 2026-11-21)
        evidence_url: docs/adr/0010-point-in-time-fundamentals.md
        notes: >-
          The firewall rejects clients identifying as python-urllib. The owner approved the
          honest identity "idx-trading/<version> (personal research)" (no browser
          imitation). Quarterly publication reports only; 1 request / 2 s; new files only.
      - purpose: raw_archive
        status: approved
        reviewed_at: 2026-11-21
        reviewed_by: claude-agent (delegated by system owner)
        evidence_url: docs/adr/0010-point-in-time-fundamentals.md
      - purpose: redistribution
        status: denied
        reviewed_at: 2026-11-21
        reviewed_by: claude-agent (delegated by system owner)
        evidence_url: docs/adr/0010-point-in-time-fundamentals.md
