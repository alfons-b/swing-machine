# Data Source Registry (PRD §6.2) — the reviewed, version-controlled source of truth.
#
# RULES
#  * A source may be used for a purpose ONLY when that purpose is listed under
#    `permissions` with status `approved`. Missing purpose == not permitted.
#  * Every approval must cite evidence (terms URL / licence text) and a review date.
#  * Never approve automated access for a source whose terms forbid it, and never
#    bypass authentication, paywalls or rate limits (PRD §6.2).
#  * Changes to this file are the audit trail: review them like code.
#
# Status of third-party sources below is `pending_review`: their terms have NOT yet
# been verified (PRD §27 open issues #1, #3, #4). They are registered so that the
# review work is tracked, but the ingestion framework will refuse to use them.

sources:
  - source_id: manual_csv
    source_name: User-supplied CSV files (manual download / own records)
    source_type: file
    source_url: null
    access_method: local_file
    license_type: user_responsibility
    terms_reference: docs/adr/0004-source-permission-gate.md
    rate_limit: null
    update_frequency: ad_hoc
    reliability_score: 0.5
    source_status: active
    notes: >-
      Files placed by the user. The user is responsible for confirming that the
      originating provider permits personal storage and analysis of the file.
      The original provider should be recorded in the import's `origin` field.
    permissions:
      - purpose: manual_import
        status: approved
        reviewed_at: 2026-11-21
        reviewed_by: system-owner
        evidence_url: docs/adr/0004-source-permission-gate.md
        notes: Manual, user-initiated imports only.
      - purpose: raw_archive
        status: approved
        reviewed_at: 2026-11-21
        reviewed_by: system-owner
        evidence_url: docs/adr/0004-source-permission-gate.md

  - source_id: exchange_calendars_lib
    source_name: exchange_calendars Python library (XIDX calendar)
    source_type: library
    source_url: https://github.com/gerrymanoim/exchange_calendars
    access_method: python_package
    license_type: Apache-2.0
    terms_reference: https://github.com/gerrymanoim/exchange_calendars/blob/master/LICENSE
    rate_limit: null
    update_frequency: on_package_upgrade
    reliability_score: 0.8
    source_status: active
    notes: >-
      Community-maintained holiday rules. Sessions can be generated from 1990, but
      rules before ~2006 look incomplete and must be checked against observed trading
      days (OI-13). Holidays must be checked against official IDX announcements (OI-14).
    permissions:
      - purpose: automated_ingestion
        status: approved
        reviewed_at: 2026-11-21
        reviewed_by: system-owner
        evidence_url: https://github.com/gerrymanoim/exchange_calendars/blob/master/LICENSE
        notes: Apache-2.0 package metadata verified at install time.

  - source_id: idx_official
    source_name: Bursa Efek Indonesia (idx.co.id)
    source_type: exchange
    source_url: https://www.idx.co.id
    access_method: web
    license_type: licensed_data_products
    terms_reference: https://www.idx.id/en/products/idx-data-services
    update_frequency: daily
    source_status: pending_review
    notes: >-
      Reviewed 2026-11-21. Every request from automation, including robots.txt, gets a
      Cloudflare "Attention Required" challenge (HTTP 403). Passing that challenge would
      be bypassing an access restriction (PRD 6.2), so automated access is NOT allowed.
      Re-checked for M1.4: the new front end www.idx.id is reachable, but it loads all
      data and files from www.idx.co.id; reaching that API via another hostname would
      sidestep the same protection, so it is not used.
      IDX sells historical/EOD data under the IDX Data Services licence (priced
      catalogue). Manual browser downloads by the owner stay possible via `manual_csv`;
      the website terms page itself could not be fetched and is still unreviewed.
    permissions:
      - purpose: automated_ingestion
        status: denied
        reviewed_at: 2026-11-21
        reviewed_by: claude-agent (delegated by system owner)
        evidence_url: docs/adr/0008-eod-source-selection.md
        notes: Bot challenge on all paths; data is sold as a licensed product.
      - purpose: manual_import
        status: pending_review

  - source_id: ksei
    source_name: Kustodian Sentral Efek Indonesia (ksei.co.id)
    source_type: depository
    source_url: https://www.ksei.co.id
    access_method: web
    license_type: unverified
    update_frequency: daily
    source_status: pending_review
    notes: Candidate for corporate action calendar and ISIN data.
    permissions:
      - purpose: automated_ingestion
        status: pending_review

  - source_id: ojk
    source_name: Otoritas Jasa Keuangan (ojk.go.id)
    source_type: regulator
    source_url: https://www.ojk.go.id
    access_method: web
    license_type: unverified
    update_frequency: ad_hoc
    source_status: pending_review
