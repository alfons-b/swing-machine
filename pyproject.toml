[project]
name = "idx-trading"
version = "0.1.0"
description = "IDX AI Trading Intelligence — quantitative research infrastructure for the Indonesia Stock Exchange (Phase 1: data foundation)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary — personal use" }
dependencies = [
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
    "exchange-calendars>=4.5,<5",
]

[project.optional-dependencies]
analytics = [
    "pandas>=2.2",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
idx = "idx_trading.cli.main:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idx_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Upstream: exchange_calendars uses a pandas API deprecated in pandas 3.1 (see docs/open-issues.md).
    "ignore::DeprecationWarning:exchange_calendars",
    "ignore:Series.values returning an ndarray:DeprecationWarning",
    "ignore:Series.values returning an ndarray:FutureWarning",
]
markers = [
    "postgres: requires a PostgreSQL database (IDX_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"tests/**" = ["DTZ"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]
